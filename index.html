<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>NAJJUBTYPE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="brandBtn" aria-label="홈">NAJJUBTYPE</button>
      <div class="top-actions">
        <button class="icon-btn" id="searchBtn" aria-label="검색">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        </button>
        <button class="icon-btn" id="openComposer" aria-label="명대사 추천">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="hero-copy">
        <h1>냐쭙 명장면 아카이브</h1>
        <p>좋아하는 작품의 명대사와 장면을 남겨주세요.</p>
      </section>

      <nav class="tabs" aria-label="정렬">
        <button class="tab active" data-view="popular">개추순</button>
        <button class="tab" data-view="latest">최신순</button>
        <button class="tab" data-view="sort">소트</button>
      </nav>

      <section id="searchPanel" class="search-panel hidden">
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
          <input id="searchInput" type="search" placeholder="작품명, 작가, 명대사 검색" autocomplete="off" />
        </div>
      </section>

      <section id="feed" class="feed" aria-live="polite"></section>

      <section id="sortSection" class="sort-section hidden">
        <div class="sort-header-card">
          <div>
            <p class="eyebrow">NAJJUBTYPE SORT</p>
            <h2>명장면 / 명대사 소트</h2>
            <p>둘 중 더 좋아하는 장면을 골라 나만의 순위를 만들어보세요.</p>
          </div>
          <button id="startSort" class="primary-btn">소트 시작</button>
        </div>
        <div class="ranking-card">
          <div class="ranking-title-row">
            <h3>🏆 소트 랭킹</h3>
            <button class="text-btn" id="showMyRecord">내 기록</button>
          </div>
          <ol id="globalRanking" class="ranking-list"></ol>
        </div>
      </section>
    </main>

    <footer class="site-footer">NAJJUBTYPE · fan-made archive prototype</footer>
  </div>

  <button class="floating-write" id="floatingWrite" aria-label="명대사 추천하기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
  </button>

  <div class="modal-backdrop hidden" id="composerModal" role="dialog" aria-modal="true" aria-labelledby="composerTitle">
    <div class="modal-sheet composer-sheet">
      <div class="sheet-header">
        <button class="text-btn" data-close="composerModal">취소</button>
        <h2 id="composerTitle">명대사 추천</h2>
        <button class="submit-link" id="submitPost">등록</button>
      </div>
      <div class="form-body">
        <label>명대사 / 명장면<span>*</span>
          <textarea id="quoteInput" rows="6" maxlength="600" placeholder="좋아하는 문장이나 장면을 입력해주세요."></textarea>
        </label>
        <div class="field-grid">
          <label>작품 제목<span>*</span><input id="titleInput" maxlength="80" placeholder="작품 제목" /></label>
          <label>작가<span>*</span><input id="authorInput" maxlength="40" placeholder="작가명" /></label>
        </div>
        <label>원문 링크<input id="linkInput" type="url" placeholder="https://..." /></label>
        <label>추천 이유<textarea id="reasonInput" rows="3" maxlength="240" placeholder="왜 좋아하는 장면인지 짧게 적어주세요."></textarea></label>
        <label>닉네임<input id="nicknameInput" maxlength="30" placeholder="익명" /></label>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="sortModal" role="dialog" aria-modal="true" aria-labelledby="sortTitle">
    <div class="modal-sheet sort-sheet">
      <div class="sheet-header">
        <button class="text-btn" data-close="sortModal">나가기</button>
        <h2 id="sortTitle">명장면 소트</h2>
        <span class="round-label" id="roundLabel">1 / 1</span>
      </div>
      <div id="sortArena" class="sort-arena"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
