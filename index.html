<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>NAJJUBTYPE</title>
  <meta name="description" content="냐쭙 명대사·명장면 아카이브" />
  <link rel="stylesheet" href="./assets/pretendard.min.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <div class="header-left"><h1>NAJJUBTYPE</h1></div>
  </header>

  <div class="main">
    <section class="submit-card" aria-labelledby="submit-title">
      <h2 id="submit-title">+ 명대사 추천</h2>
      <div class="form-row">
        <textarea id="quoteInput" rows="3" maxlength="700" placeholder="명대사 (지문 가능)"></textarea>
      </div>
      <div class="form-row">
        <input id="titleInput" type="text" maxlength="120" placeholder="제목" />
      </div>
      <div class="form-row">
        <input id="authorInput" type="text" maxlength="80" placeholder="작가" />
      </div>
      <div class="form-row">
        <input id="linkInput" type="text" maxlength="300" placeholder="링크 (터진건 걍 비워두세염)" />
      </div>
      <div class="form-row">
        <textarea id="reasonInput" rows="2" maxlength="300" placeholder="이유"></textarea>
      </div>
      <button class="btn" id="submitPostBtn">제출</button>
    </section>

    <nav class="sort-bar" aria-label="정렬">
      <button id="sortTop" class="active" data-view="top">추천순</button>
      <button id="sortNew" data-view="new">최신순</button>
      <button id="sortRank" data-view="rank">소트</button>
    </nav>

    <section id="feedView" class="feed-view">
      <div id="menuList" class="menu-list"></div>
    </section>

    <section id="rankView" class="rank-view" hidden>
      <div id="tournamentLeaderboard">
        <div class="tournament-header">
          <h2>🏆 명장면/명대사 소트 랭킹</h2>
          <div class="tournament-actions">
            <button class="tournament-btn tournament-btn-ghost" id="tournamentHistoryBtn">내 기록</button>
            <button class="tournament-btn" id="tournamentPlayBtn">참여하기</button>
          </div>
        </div>
        <div id="rankingList"></div>
      </div>

      <div id="tournamentGame" hidden>
        <div class="tournament-header">
          <h2 id="gameTitle">라운드 선택</h2>
          <div class="tournament-actions">
            <button class="tournament-btn tournament-btn-ghost" id="gameRankingBtn">랭킹 보기</button>
            <button class="tournament-btn" id="tournamentBackBtn" hidden>돌아가기</button>
          </div>
        </div>
        <div id="roundSelect" class="round-select"></div>
        <div id="matchArea"></div>
      </div>

      <div id="tournamentResult" hidden></div>

      <div id="tournamentHistory" hidden>
        <div class="tournament-header">
          <h2>📋 내 소트 기록</h2>
          <div class="tournament-actions">
            <button class="tournament-btn tournament-btn-ghost" id="historyRankingBtn">랭킹 보기</button>
            <button class="tournament-btn" id="historyPlayBtn">참여하기</button>
          </div>
        </div>
        <div id="historyList"></div>
      </div>
    </section>
  </div>

  <div class="modal-overlay" id="editModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal-header"><h3 id="editTitle">등록글 수정</h3><button class="close-modal" data-close="editModal" aria-label="닫기">×</button></div>
      <div class="modal-body edit-form">
        <label>명대사 · 장면<textarea id="editQuote" rows="5"></textarea></label>
        <label>작품 제목<input id="editWorkTitle"></label>
        <label>작가명<input id="editAuthor"></label>
        <label>포스타입 링크<input id="editLink"></label>
        <label>추천 이유<textarea id="editReason" rows="2"></textarea></label>
      </div>
      <div class="modal-footer"><button class="btn-cancel" data-close="editModal">취소</button><button class="btn-confirm" id="saveEditBtn">저장</button></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
